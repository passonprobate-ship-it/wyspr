# Gradle JVM — Keystone has more modules than xpat, give it headroom.
# If KSP/Hilt OOM on Pi 5, bump to -Xmx2048m.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx512m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ARM64 build on Pi 5 — Google's aapt2 is x86_64 only.
android.aapt2FromMavenOverride=/usr/bin/aapt2

# Release signing (placeholders — generate keystore before release builds)
KEYSTONE_STORE_FILE=keystore/keystone-release.jks
KEYSTONE_STORE_PASSWORD=
KEYSTONE_KEY_ALIAS=keystone
KEYSTONE_KEY_PASSWORD=
