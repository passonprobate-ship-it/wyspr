# Gradle JVM — Wyspr has more modules than xpat, give it headroom.
# If KSP/Hilt OOM on Pi 5, bump to -Xmx2048m.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Daemon reuses the JVM across invocations. Cold-start was burning
# ~15-30s per build on the Pi 5 before this.
org.gradle.daemon=true
# Parallel project execution + on-disk build cache. With ~16 modules
# this is a meaningful per-build win once the cache warms.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache (Gradle 8.x stable) — reuses the configured task
# graph between invocations. ~20-40% off the configuration phase.
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ARM64 build on Pi 5 — Google's aapt2 is x86_64 only.
android.aapt2FromMavenOverride=/usr/bin/aapt2

# Release signing (placeholders — supply real values via local.properties,
# -P CLI flags, or environment for a signed release build). All four must
# be present; blank placeholders here document the schema without leaking
# anything sensitive into git. Empty values are explicitly skipped by the
# signingProp() helper in app/build.gradle.kts.
WYSPR_STORE_FILE=keystore/wyspr-release.jks
WYSPR_STORE_PASSWORD=
WYSPR_KEY_ALIAS=
WYSPR_KEY_PASSWORD=
