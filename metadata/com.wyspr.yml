# F-Droid build manifest for Wyspr.
#
# This file is the draft we plan to submit to f-droid/fdroiddata.
# It is checked into our own repo so the build recipe lives next
# to the code it builds. When we submit, this file is copied as-is
# into fdroiddata/metadata/com.wyspr.yml.
#
# Schema reference: https://f-droid.org/docs/Build_Metadata_Reference/

Categories:
  - Security
  - Connectivity
License: Apache-2.0
AuthorName: Wyspr contributors
SourceCode: https://github.com/passonprobate-ship-it/wyspr
IssueTracker: https://github.com/passonprobate-ship-it/wyspr/issues

AutoName: Wyspr

# Each Build entry corresponds to one tagged release in this repo.
# The commit field MUST be a tag (not a branch or SHA) so F-Droid
# can pin the build.
Builds:
  - versionName: 0.9.1
    versionCode: 22
    commit: v0.9.1
    subdir: app
    gradle:
      - yes
    # Tor binaries and libsodium native libraries arrive as
    # pre-built AAR artifacts via kmp-tor and lazysodium-android.
    # The from-source rebuild path is not yet wired. For the first
    # listing we declare the deviation honestly and accept that
    # F-Droid's reproducible-build check will fail until we ship
    # from-source builds.
    prebuilds:
      - com.goterl:lazysodium-android:5.1.0
      - io.matthewnelson.kmp-tor:resource-exec-tor:408.13.2
      - io.matthewnelson.kmp-tor:resource-noexec-tor:408.13.2

  - versionName: 0.9.9
    versionCode: 30
    commit: v0.9.9
    subdir: app
    gradle:
      - yes
    # Same prebuilt-artifact deviation as 0.9.1: Tor and libsodium
    # native libs arrive as pre-built AARs (kmp-tor, lazysodium-android);
    # versions unchanged from the 0.9.1 entry.
    prebuilds:
      - com.goterl:lazysodium-android:5.1.0
      - io.matthewnelson.kmp-tor:resource-exec-tor:408.13.2
      - io.matthewnelson.kmp-tor:resource-noexec-tor:408.13.2

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.9.9
CurrentVersionCode: 30
