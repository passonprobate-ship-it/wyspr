[versions]
agp = "8.2.0"
# Kotlin 2.1: bumped 2026-05-22 to unblock im.molly:monero-wallet-sdk
# (strict kotlin-stdlib:2.1.0). Brings the Compose Compiler in as a
# first-party Kotlin plugin — see compose-plugin below. kmp-tor 2.0.0
# stays pinned (forward-compat: 2.1 compiler reads older metadata).
kotlin = "2.1.20"
# KSP 1.x compatible mode. KSP 2.0.0 (2.1.20-2.0.0) broke Room 2.6.1
# and Hilt 2.50's KSP processors — they're built against the older
# KSP-1 API. Stay on the -1.0.32 line until we bump those.
ksp = "2.1.20-1.0.32"
compose-bom = "2024.02.00"
# Compose compiler is now a Kotlin plugin (org.jetbrains.kotlin.plugin.compose)
# from Kotlin 2.0+. The per-module composeOptions.kotlinCompilerExtensionVersion
# is no longer needed — the plugin's version aligns with Kotlin's.
compose-plugin = "2.1.20"
room = "2.6.1"
hilt = "2.55"
navigation = "2.7.7"
lifecycle = "2.7.0"
activity = "1.8.2"
coroutines = "1.7.3"
core-ktx = "1.12.0"
splashscreen = "1.0.1"
biometric = "1.1.0"
fragment = "1.6.2"
datastore = "1.0.0"
security-crypto = "1.1.0-alpha06"
sqlcipher = "4.6.0"
sqlite = "2.4.0"
lazysodium = "5.1.0"
jna = "5.13.0"
noise-java = "49377b6"
bcprov = "1.78.1"
zxing = "3.5.2"
camerax = "1.3.1"
kmp-tor = "2.0.0"
kmp-tor-resource = "408.13.2"
junit = "4.13.2"
kotlin-test = "2.1.20"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.1.0" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

noise-java = { group = "com.github.rweather", name = "noise-java", version.ref = "noise-java" }
